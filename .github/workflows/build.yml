name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Source Code
        run: |
          if [ -f vpn_checker_app.zip ]; then
            unzip -q vpn_checker_app.zip
            if [ -d vpn_checker_app ]; then
              mv vpn_checker_app/* .
              mv vpn_checker_app/.* . 2>/dev/null || true
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Auto-Fix Android V1 Embedding
        run: flutter create --org com.myvpn --project-name checker --platforms android .

      - name: Fix Gradle Errors (Packaging & Shrink)
        run: |
          sed -i 's/packaging {/packagingOptions {/g' android/app/build.gradle
          python3 -c "
          import re
          file_path = 'android/app/build.gradle'
          with open(file_path, 'r') as f:
              content = f.read()
          content = re.sub(r'shrinkResources\s+true', 'shrinkResources false', content)
          content = re.sub(r'shrinkResources\s*=\s*true', 'shrinkResources false', content)
          with open(file_path, 'w') as f:
              f.write(content)
          "

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-files
          path: build/app/outputs/flutter-apk/*.apk
